name: Download APK

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download XAPK
        run: python main.py jp.co.ponos.battlecats

      - name: Download and Extract Tool
        run: |
          wget https://github.com/piggecutlet/battlecats-cryptor/releases/download/v0.2.0/battlecats-cryptor_0.2.0.zip -O tool.zip
          unzip -o tool.zip -d tool_dir
          # ディレクトリ構造（lib等）を保持したまま移動
          cp -r tool_dir/battlecats-cryptor_0.2.0/* . 2>/dev/null || cp -r tool_dir/* .
          ls -la

      - name: Run Java Command
        run: |
          JAR_FILE=$(ls *.jar | grep -i "battlecats" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: JAR file not found"
            exit 1
          fi
          java -jar "$JAR_FILE" decrypt jp

      - name: Setup SSH Key and Git Config for Signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_ed25519.pub

          git config --global user.name "piggecutlet"
          git config --global user.email "234113501+piggecutlet@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/id_ed25519
          git config --global commit.gpgsign true

      - name: Commit and Push workspace/decrypt Only
        run: |
          rm -f app.xapk tool.zip
          rm -rf tool_dir lib
          git add workspace/decrypt
          git commit -S -m "Add decrypted workspace files"
          git push
